<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Chiranjivi Sah</title>
  <desc id="d">A lab notebook page. The name Chiranjivi Sah is written in ink and the line "I build web apps, games and tools for real people" gets highlighted. A flask on the right bubbles.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D3DCEF" stroke-width="1"/>
    </pattern>
    <style>
      .ink { fill: #1B2A6B; }
      .name {
        font: 700 80px Georgia, 'Times New Roman', serif;
        letter-spacing: -1px;
        fill: #1B2A6B; fill-opacity: 0;
        stroke: #1B2A6B; stroke-width: 1.4;
        stroke-dasharray: 420; stroke-dashoffset: 420;
        animation: write 2s ease-in-out .2s forwards, ink .6s ease-out 1.9s forwards;
      }
      .line { font: 500 30px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1B2A6B; opacity: 0; animation: show .5s ease-out 2.2s forwards; }
      .hl { fill: #FFE45C; transform-box: fill-box; transform-origin: left center; transform: scaleX(0) skewX(-8deg); animation: sweep .7s cubic-bezier(.6,0,.3,1) 2.8s forwards; }
      .flask { fill: none; stroke: #1B2A6B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 700; stroke-dashoffset: 700; animation: write 1.6s ease-in-out .6s forwards; }
      .liquid { fill: #FFE45C; opacity: 0; animation: show .6s ease-out 2s forwards; }
      .bubble { fill: none; stroke: #1B2A6B; stroke-width: 2; opacity: 0; animation: rise 3s ease-in 2.4s infinite; }
      .b2 { animation-delay: 3.4s; } .b3 { animation-delay: 4.3s; }

      @keyframes write { to { stroke-dashoffset: 0; } }
      @keyframes ink { to { fill-opacity: 1; } }
      @keyframes show { to { opacity: 1; } }
      @keyframes sweep { to { transform: scaleX(1) skewX(-8deg); } }
      @keyframes rise {
        0% { opacity: 0; transform: translateY(0); }
        15% { opacity: 1; }
        80% { opacity: .8; }
        100% { opacity: 0; transform: translateY(-170px); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .name { fill-opacity: 1; stroke-dashoffset: 0; }
        .line, .liquid { opacity: 1; }
        .hl { transform: skewX(-8deg); }
        .flask { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- paper -->
  <rect x="1" y="1" width="1198" height="338" rx="14" fill="#F4F7FD" stroke="#C9D3EA"/>
  <rect x="1" y="1" width="1198" height="338" rx="14" fill="url(#grid)"/>
  <line x1="100" y1="1" x2="100" y2="339" stroke="#E5484D" stroke-opacity=".55" stroke-width="2"/>
  <g fill="#FFFFFF" stroke="#C9D3EA" stroke-width="1.5">
    <circle cx="48" cy="80" r="11"/><circle cx="48" cy="170" r="11"/><circle cx="48" cy="260" r="11"/>
  </g>

  <!-- name -->
  <text class="name" x="140" y="160">Chiranjivi Sah</text>

  <!-- highlighted line -->
  <rect class="hl" x="134" y="200" width="706" height="40" rx="4"/>
  <text class="line" x="140" y="230">I build web apps, games and tools for real people.</text>


  <!-- flask -->
  <path class="liquid" d="M980 232 Q1005 222 1030 232 T1080 232 L1104 280 Q1108 290 1098 290 H962 Q952 290 956 280 Z"/>
  <circle class="bubble" cx="1022" cy="262" r="6"/>
  <circle class="bubble b2" cx="1036" cy="270" r="4"/>
  <circle class="bubble b3" cx="1028" cy="276" r="3"/>
  <path class="flask" d="M1002 82 H1058 M1012 82 V170 L954 280 Q948 292 962 292 H1098 Q1112 292 1106 280 L1048 170 V82 M1024 200 H1036 M1018 222 H1030"/>
</svg>
